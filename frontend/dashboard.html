    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Poppins', 'Noto Sans Malayalam', Arial, sans-serif;
            background: var(--kerala-cream);
            color: #333;
        }

        /* Header */
        header {
            background: var(--kerala-gradient);
            color: white;
            padding: 1rem 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 4px solid var(--kerala-gold);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .logo small {
            display: block;
            font-size: 0.5em;
            opacity: 0.9;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .logo img.app-logo {
            height: 80px;
            width: auto;
            display: block;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }
        .animated-logo { animation: logoFloat 6s ease-in-out infinite, logoFade 1.2s ease-in-out 1; }
        @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes logoFade { 0% { opacity:0; transform: scale(0.9);} 100% { opacity:1; transform: scale(1);} }

        .user-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .user-info {
            text-align: right;
        }

        .user-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .user-email {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }

        .btn-logout {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-logout:hover {
            background: white;
            color: var(--kerala-green);
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid var(--kerala-gold);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        .stat-label {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--kerala-green);
        }

        /* Action Section */
        .action-section {
            background: var(--kerala-gradient);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 2rem;
            color: white;
            border-top: 4px solid var(--kerala-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .action-section h2 {
            margin-bottom: 1rem;
        }

        .btn-create {
            background: white;
            color: var(--kerala-green);
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-create:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            background: var(--kerala-gold);
            color: white;
        }

        /* Orders Section */
        .orders-section {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid var(--kerala-gold);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--kerala-green);
            font-weight: 700;
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
        }

        .tab {
            padding: 0.5rem 1rem;
            border: 2px solid #e2e8f0;
            background: white;
            color: #718096;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: var(--kerala-green);
            color: white;
            border-color: var(--kerala-green);
        }

        /* Orders Table */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .orders-table th {
            background: #f8f9fa;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #2d3748;
            border-bottom: 2px solid #e2e8f0;
        }

        .orders-table td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .orders-table tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-download {
            background: #48bb78;
            color: white;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .btn-download:hover {
            background: #38a169;
            transform: translateY(-1px);
        }

        .btn-download:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
        }
        
        .btn-download:hover:disabled {
            transform: none;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .loading-state {
            text-align: center;
            padding: 3rem;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--kerala-green);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 968px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 1rem;
            }
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            .user-section {
                flex-direction: column;
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .orders-table {
                font-size: 0.85rem;
                min-width: 700px;
            }

            .orders-table th,
            .orders-table td {
                padding: 0.75rem 0.5rem;
            }

            .btn-download {
                font-size: 0.85rem;
                padding: 0.5rem 1rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .stat-value {
                font-size: 1.8rem;
            }

            .action-section {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <img src="logo.png" alt="EasySlip Logo" class="app-logo animated-logo" />
            </div>
            <div class="user-section">
                <div class="user-info">
                    <div class="user-name" id="userName">Loading...</div>
                    <div class="user-email" id="userEmail"></div>
                </div>
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
         <!-- Action Section -->
        <div class="action-section">
            <h2>Create New Voter Slips</h2>
            <p>Generate customized voter slips for your election campaign</p>
            <br>
            <a href="create-slip.html" class="btn btn-create">+ Create New Slip</a>
        </div>
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Orders</div>
                <div class="stat-value" id="totalOrders">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedOrders">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Voters</div>
                <div class="stat-value" id="totalVoters">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Spent</div>
                <div class="stat-value" id="totalAmount">₹0</div>
            </div>
        </div>

       

        <!-- Orders Section -->
        <div class="orders-section">
            <div class="section-header">
                <h2 class="section-title">Your Orders</h2>
                <div class="filter-tabs">
                    <button class="tab active" data-filter="all">All</button>
                    <button class="tab" data-filter="completed">Completed</button>
                    <button class="tab" data-filter="pending">Pending</button>
                </div>
            </div>

            <div id="ordersContainer">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="console-control.js"></script>
    <script src="activity-tracker.js"></script>
    <script>
        let allOrders = [];
        let currentFilter = 'all';

        // Check authentication
        const token = localStorage.getItem('token');
        if (!token) {
            // Save the intended destination before redirecting to login
            sessionStorage.setItem('redirectAfterLogin', window.location.pathname);
            window.location.href = 'login.html';
        }

        let currentUserId = null; // Store logged-in user's ID

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch('/api/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        // Only logout on explicit unauthorized
                        throw new Error('Authentication failed');
                    }
                    // Network error - use cached data
                    const cachedUser = localStorage.getItem('user');
                    if (cachedUser) {
                        const userData = JSON.parse(cachedUser);
                        currentUserId = userData._id;
                        document.getElementById('userName').textContent = userData.name;
                        document.getElementById('userEmail').textContent = userData.email;
                        console.log('Using cached user data due to network error');
                        return;
                    }
                    throw new Error('Authentication failed');
                }

                const data = await response.json();
                currentUserId = data.user._id; // Store user ID
                
                // Cache user data
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Check if user is admin and redirect
                if (data.user.role === 'admin') {
                    console.log('Admin user detected, redirecting to admin dashboard...');
                    window.location.href = 'admin.html';
                    return;
                }
                
                document.getElementById('userName').textContent = data.user.name;
                document.getElementById('userEmail').textContent = data.user.email;
            } catch (error) {
                console.error('Error loading user:', error);
                // Only logout on auth failure, not network errors
                if (error.message === 'Authentication failed') {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.href = 'login.html';
                }
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch('/api/orders/stats/summary', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('totalOrders').textContent = data.totalOrders;
                    document.getElementById('completedOrders').textContent = data.completedOrders;
                    document.getElementById('totalVoters').textContent = data.totalVoters;
                    document.getElementById('totalAmount').textContent = `₹${data.totalAmount.toFixed(2)}`;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Load orders
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    allOrders = await response.json();
                    displayOrders();
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <h3>Failed to load orders</h3>
                        <p>Please try again</p>
                    </div>
                `;
            }
        }

        // Display orders
        function displayOrders() {
            const container = document.getElementById('ordersContainer');
            
            let filteredOrders = allOrders;
            if (currentFilter === 'completed') {
                filteredOrders = allOrders.filter(o => o.paymentStatus === 'completed');
            } else if (currentFilter === 'pending') {
                filteredOrders = allOrders.filter(o => o.paymentStatus === 'pending');
            }

            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="fas fa-clipboard-list"></i></div>
                        <h3>No Orders Found</h3>
                        <p>Create your first voter slip</p>
                    </div>
                `;
                return;
            }

            const tableHTML = `
                <div class="table-wrapper">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Location</th>
                                <th>Voters</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                    <tbody>
                        ${filteredOrders.map(order => `
                            <tr>
                                <td><strong>${order.orderId}</strong></td>
                                <td>${new Date(order.createdAt).toLocaleDateString('en-IN')}</td>
                                <td>
                                    <div style="font-size: 0.9rem; line-height: 1.4;">
                                        <div><strong>${order.location.wardName || order.location.ward || '-'}</strong></div>
                                        <div style="color: #666; font-size: 0.85rem;">${order.location.localBodyName || order.location.localBody || '-'}</div>
                                    </div>
                                </td>
                                <td>${order.voterCount}</td>
                                <td>₹${order.amount.toFixed(2)}</td>
                                <td>
                                    <span class="status-badge status-${order.paymentStatus}">
                                        ${order.paymentStatus === 'completed' ? 'Completed' : 
                                          order.paymentStatus === 'pending' ? 'Pending' : 'Failed'}
                                    </span>
                                </td>
                                <td>
                                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                                        <a href="preview.html?orderId=${order.orderId}" class="btn btn-download" style="background: var(--kerala-green); text-decoration: none; display: inline-block;">
                                            <i class="fas fa-eye"></i> View
                                        </a>
                                        ${order.paymentStatus === 'completed' 
                                            ? `<button class="btn btn-download" onclick="downloadSlip('${order.orderId}')"><i class="fas fa-download"></i> PDF</button>
                                               <button class="btn btn-download" onclick="downloadInvoice('${order.orderId}')" style="background: #10b981;"><i class="fas fa-file-invoice"></i> Invoice</button>`
                                            : `<button class="btn btn-download" style="background: var(--kerala-gold);" onclick="window.location.href='preview.html?orderId=${order.orderId}'"><i class="fas fa-credit-card"></i> Pay Now</button>`
                                        }
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                </div>
            `;

            container.innerHTML = tableHTML;
        }

        // Filter tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                displayOrders();
            });
        });

        // Download invoice
        async function downloadInvoice(orderId) {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    alert('Please login to download invoice');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`/api/orders/${orderId}/invoice`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    if (response.status === 400) {
                        alert('Invoice only available for completed payments');
                    } else {
                        alert(errorData.message || 'Failed to download invoice');
                    }
                    return;
                }

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `invoice-${orderId}.pdf`;
                document.body.appendChild(a);
                a.click();
                
                // Track invoice download
                if (window.trackActivity) {
                    window.trackActivity('invoice_downloaded', {
                        orderId: orderId,
                        fileName: `invoice-${orderId}.pdf`
                    });
                }
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);
                }, 100);

            } catch (error) {
                console.error('Invoice download error:', error);
                alert('Failed to download invoice. Please try again.');
            }
        }

        // Download slip
        async function downloadSlip(orderId) {
            try {
                // Verify token exists before attempting download
                if (!token) {
                    alert('Session expired. Please login again.');
                    window.location.href = 'login.html';
                    return;
                }

                const response = await fetch(`/api/slips/download/${orderId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `voter-slips-${orderId}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    // Track PDF download
                    if (window.trackActivity) {
                        window.trackActivity('pdf_downloaded', {
                            orderId: orderId,
                            fileName: `voter-slips-${orderId}.pdf`
                        });
                    }
                } else {
                    // Parse error response to show actual error
                    try {
                        const errorData = await response.json();
                        console.error('Download error response:', errorData);
                        
                        if (response.status === 401) {
                            alert('Session expired. Please login again.');
                            window.location.href = 'login.html';
                        } else if (response.status === 403) {
                            alert(errorData.message || 'Download not allowed. Please complete payment.');
                        } else if (response.status === 404) {
                            alert('Order not found.');
                        } else {
                            alert(errorData.message || 'Download failed. Please try again.');
                        }
                    } catch (parseError) {
                        console.error('Error parsing response:', parseError);
                        alert(`Download failed (${response.status}). Please try again.`);
                    }
                }
            } catch (error) {
                console.error('Download error:', error);
                alert('Download failed. Network error. Please try again.');
            }
        }

        // Logout
        function logout() {
            // Track logout activity
            if (window.trackActivity) {
                window.trackActivity('logout', {
                    timestamp: new Date().toISOString()
                });
            }
            
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // Load data on page load
        loadUserData();
        loadStats();
        loadOrders();
    </script>
</body>
</html>
