<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>വോട്ടർ സ്ലിപ്പുകൾ - Voter Information Slips</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" href="/favicon/favicon.ico">
    <link rel="manifest" href="/favicon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="slips.css">

<body>
    <div class="no-print controls">
        <div class="container">
            <h1><i class="fas fa-vote-yea"></i> വോട്ടർ സ്ലിപ്പുകൾ സൃഷ്ടിക്കുക</h1>
            <p>Print-ready voter information slips (5 per A4 page)</p>
            
            <div class="button-group">
                <button id="backBtn" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back to Extraction</button>
                <button id="printBtn" class="btn-primary"><i class="fas fa-print"></i> Print Slips</button>
            </div>
        </div>
    </div>

    <div id="slipsContainer"></div>

    <script src="slips.js"></script>
    <script src="console-control.js"></script>
