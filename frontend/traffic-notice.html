<!-- Traffic Notice Banner - Include this at the top of every page -->
<div id="trafficNotice" style="background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%); border-left: 4px solid #F59E0B; padding: 1rem 1.5rem; margin: 1rem auto; max-width: 1200px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: start; gap: 1rem; animation: slideDown 0.5s ease-out;">
    <div style="flex-shrink: 0; font-size: 1.5rem; color: #F59E0B;">
        <i class="fas fa-exclamation-triangle"></i>
    </div>
    <div style="flex: 1;">
        <div style="font-weight: 600; color: #92400E; margin-bottom: 0.25rem; font-size: 1rem;">
            <i class="fas fa-info-circle"></i> High Traffic Notice
        </div>
        <div style="color: #78350F; font-size: 0.9rem; line-height: 1.5;">
            Due to heavy traffic, you may experience slowness in loading captcha and voter details. If you're unable to proceed, please try again after some time. We apologize for the inconvenience.
        </div>
    </div>
    <button onclick="document.getElementById('trafficNotice').style.display='none'" style="background: none; border: none; color: #92400E; cursor: pointer; font-size: 1.25rem; padding: 0; line-height: 1; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
        <i class="fas fa-times"></i>
    </button>
</div>

<style>
@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    #trafficNotice {
        margin: 0.5rem;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
    }
    
    #trafficNotice > div:first-child {
        font-size: 1.25rem;
    }
}
</style>
