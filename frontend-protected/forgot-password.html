        .logo-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .logo-section img.app-logo {
            height: 120px;
            width: auto;
            display: block;
            margin: 0 auto 1rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
        }

        .logo-section h1 {
            font-size: 2rem;
            color: var(--kerala-green);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .logo-section p {

            font-size: 0.95rem;

        }

            margin-bottom: 1.5rem;
        }

            display: block;
            margin-bottom: 0.5rem;
            color: var(--kerala-dark);
            font-weight: 600;
        }

            width: 100%;
            padding: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--kerala-green);
            box-shadow: 0 0 0 4px rgba(0, 109, 59, 0.1);
        }

        .error-message {
            color: var(--kerala-red);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 1.1rem;
            background: var(--kerala-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(0, 109, 59, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 109, 59, 0.5);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--kerala-green);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--kerala-gold);
        }

        .loading {
            display: none;
            text-align: center;
            margin: 1rem 0;
        }

            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--kerala-green);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-box {
            background: #e7f3ff;
            border: 2px solid #b3d9ff;

            color: #004085;

        @media (max-width: 768px) {

            }

        }

        @media (max-width: 480px) {

            }

            .btn {

                font-size: 0.95rem;
            }
        }
