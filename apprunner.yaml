# AWS App Runner configuration file
# This file defines the build and runtime configuration for deploying to AWS App Runner

version: 1.0
runtime: nodejs16

build:
  commands:
    pre-build:
      - npm install --production
      - mkdir -p generated-pdfs uploads

run:
  command: node server.js
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: USE_PROTECTED
      value: "true"
    # Database - Set in AWS App Runner console or via secrets
    # - name: MONGODB_URI
    # - name: JWT_SECRET
    # - name: FRONTEND_URL
    # Razorpay
    # - name: RAZORPAY_KEY_ID
    # - name: RAZORPAY_KEY_SECRET
    # - name: RAZORPAY_WEBHOOK_SECRET
    # Google Drive
    # - name: GOOGLE_DRIVE_CLIENT_ID
    # - name: GOOGLE_DRIVE_CLIENT_SECRET
    # - name: GOOGLE_DRIVE_REFRESH_TOKEN
    # - name: GOOGLE_DRIVE_FOLDER_ID
    # - name: GCS_BUCKET_NAME
