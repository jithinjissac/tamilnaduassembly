version: 1.0
runtime: nodejs20
build:
  commands:
    pre-build:
      - echo "Installing dependencies..."
    build:
      - npm install
      - npx playwright install-deps
      - npx playwright install chromium
    post-build:
      - echo "Build completed"
run:
  command: npm start
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: "production"
    - name: PORT
      value: "3000"
